<header>
  <nav>
    <a routerLink="/">Inicio</a>
    @if (authS.usuarioActual()) {
      <span>{{ authS.usuarioActual()?.email }} ({{ authS.rol() }})</span>
      <button (click)="cerrarSesion()">Cerrar sesión</button>
    } @else {
      <a routerLink="/auth/login">Ingresar</a>
      <a routerLink="/auth/registro">Registrarse</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
